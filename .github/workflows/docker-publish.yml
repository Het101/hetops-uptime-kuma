name: Publish Multi-Arch Docker Image

on:
  push:
    branches:
      - master
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The image's build stage copies the repo as-is and expects the frontend already built
      # (upstream's release process runs `npm run build` first). Without this the image has no
      # dist/ and the server exits with "Cannot find 'dist/index.html'".
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build the frontend
        run: |
          npm ci
          npm run build
          test -f dist/index.html || { echo "::error::dist/index.html missing after build"; exit 1; }

      # Start the real image and ask it for a page before anything is pushed. A frontend-less
      # image once reached Docker Hub and took status.hetops.dev down; this makes that impossible.
      - name: Smoke-test the image
        run: |
          set -e
          docker build -f ./docker/dockerfile --target release -t hetops-status:smoke .
          docker run -d --name smoke -p 3001:3001 hetops-status:smoke
          trap 'docker logs smoke | tail -40; docker rm -f smoke > /dev/null' EXIT
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/setup-database || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:3001/setup-database | grep -q '<div id="app"' || { echo "::error::the image did not serve the app"; exit 1; }
          curl -fsS -o /dev/null http://127.0.0.1:3001/icon.svg
          echo "image serves the app"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/hetops-status

      - name: Build and push Multi-Arch Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/dockerfile
          target: release
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
